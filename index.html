<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Shopping Portal</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-50 min-h-screen text-gray-800">

    <div class="max-w-6xl mx-auto py-8 px-4">

        <!-- Header -->
        <header class="text-center mb-8">
            <h1 class="text-4xl font-extrabold text-blue-600 tracking-tight">
                Online Shopping Portal
            </h1>
            <p class="text-gray-500 mt-2">
                Browse products, add items to your cart, and place your order easily.
            </p>
        </header>

        <!-- Search and Filter Section -->
        <div class="bg-white p-5 rounded-xl shadow-md border border-gray-100 mb-8">

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                <!-- Search -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-600 mb-1">
                        Search Products
                    </label>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search for products..."
                        onkeyup="displayProducts()"
                        class="w-full border border-gray-300 rounded-lg p-3
                        focus:ring-2 focus:ring-blue-400 outline-none"
                    >
                </div>

                <!-- Category -->
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">
                        Category
                    </label>

                    <select
                        id="categoryFilter"
                        onchange="displayProducts()"
                        class="w-full border border-gray-300 rounded-lg p-3
                        focus:ring-2 focus:ring-blue-400 outline-none"
                    >
                        <option value="All">All Categories</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Fashion">Fashion</option>
                        <option value="Home">Home</option>
                        <option value="Books">Books</option>
                    </select>
                </div>

            </div>
        </div>


        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <!-- Products -->
            <div class="lg:col-span-2">

                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold text-gray-700">
                        Products
                    </h2>

                    <span
                        id="productCount"
                        class="text-sm text-gray-500">
                    </span>
                </div>

                <div
                    id="productsContainer"
                    class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
                </div>

            </div>


            <!-- Shopping Cart -->
            <div>

                <div class="bg-white p-6 rounded-xl shadow-md border border-gray-100 sticky top-5">

                    <div class="flex justify-between items-center mb-5">
                        <h2 class="text-2xl font-bold text-gray-700">
                            Shopping Cart
                        </h2>

                        <span
                            id="cartCount"
                            class="bg-blue-600 text-white text-xs
                            font-bold px-3 py-1 rounded-full">
                            0
                        </span>
                    </div>

                    <div
                        id="cartContainer"
                        class="space-y-3">
                    </div>

                    <hr class="my-5">

                    <!-- Total -->
                    <div class="flex justify-between items-center text-lg font-bold">
                        <span>Total</span>

                        <span
                            id="cartTotal"
                            class="text-blue-600">
                            ₹0
                        </span>
                    </div>

                    <!-- Checkout -->
                    <button
                        onclick="checkout()"
                        class="mt-5 w-full bg-green-600
                        hover:bg-green-700 text-white font-bold
                        py-3 px-6 rounded-xl shadow-lg
                        transition-all">
                        Proceed to Checkout
                    </button>

                    <!-- Clear Cart -->
                    <button
                        onclick="clearCart()"
                        class="mt-3 w-full bg-gray-100
                        hover:bg-gray-200 text-gray-700
                        font-semibold py-2 px-4 rounded-lg">
                        Clear Cart
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        // Product database
        const products = [

            {
                id: 1,
                name: "Wireless Headphones",
                category: "Electronics",
                price: 1499,
                emoji: "🎧",
                description: "High-quality wireless headphones."
            },

            {
                id: 2,
                name: "Smart Watch",
                category: "Electronics",
                price: 2499,
                emoji: "⌚",
                description: "Smart watch with fitness tracking."
            },

            {
                id: 3,
                name: "Bluetooth Speaker",
                category: "Electronics",
                price: 1299,
                emoji: "🔊",
                description: "Portable Bluetooth speaker."
            },

            {
                id: 4,
                name: "Cotton T-Shirt",
                category: "Fashion",
                price: 599,
                emoji: "👕",
                description: "Comfortable cotton T-shirt."
            },

            {
                id: 5,
                name: "Running Shoes",
                category: "Fashion",
                price: 1999,
                emoji: "👟",
                description: "Lightweight running shoes."
            },

            {
                id: 6,
                name: "Backpack",
                category: "Fashion",
                price: 899,
                emoji: "🎒",
                description: "Durable everyday backpack."
            },

            {
                id: 7,
                name: "Table Lamp",
                category: "Home",
                price: 799,
                emoji: "💡",
                description: "Modern LED table lamp."
            },

            {
                id: 8,
                name: "Coffee Mug",
                category: "Home",
                price: 299,
                emoji: "☕",
                description: "Ceramic coffee mug."
            },

            {
                id: 9,
                name: "Programming Book",
                category: "Books",
                price: 699,
                emoji: "📚",
                description: "Learn programming concepts."
            }

        ];


        // Shopping cart
        let cart = [];


        // Display products
        function displayProducts() {

            const container =
                document.getElementById("productsContainer");

            const search =
                document.getElementById("searchInput")
                .value
                .toLowerCase();

            const category =
                document.getElementById("categoryFilter")
                .value;


            const filteredProducts = products.filter(product => {

                const matchesSearch =
                    product.name.toLowerCase()
                    .includes(search);

                const matchesCategory =
                    category === "All" ||
                    product.category === category;

                return matchesSearch && matchesCategory;

            });


            container.innerHTML = "";


            document.getElementById("productCount").textContent =
                `${filteredProducts.length} products`;


            if (filteredProducts.length === 0) {

                container.innerHTML = `
                    <div class="col-span-full text-center
                    py-10 text-gray-400">
                        <div class="text-4xl">😞</div>
                        <p class="mt-2">
                            No products found.
                        </p>
                    </div>
                `;

                return;
            }


            filteredProducts.forEach(product => {

                const productCard =
                    document.createElement("div");

                productCard.className =
                    "bg-white rounded-xl shadow-md border " +
                    "border-gray-100 overflow-hidden " +
                    "hover:shadow-lg transition-all";


                productCard.innerHTML = `

                    <div class="bg-blue-50 h-40
                    flex items-center justify-center">

                        <span class="text-7xl">
                            ${product.emoji}
                        </span>

                    </div>

                    <div class="p-4">

                        <span class="text-xs font-semibold
                        text-blue-600 bg-blue-50 px-2 py-1
                        rounded">

                            ${product.category}

                        </span>

                        <h3 class="text-lg font-bold
                        text-gray-700 mt-3">

                            ${product.name}

                        </h3>

                        <p class="text-sm text-gray-500
                        mt-1">

                            ${product.description}

                        </p>

                        <div class="flex justify-between
                        items-center mt-4">

                            <span class="text-xl font-bold
                            text-blue-600">

                                ₹${product.price}

                            </span>

                            <button
                                onclick="addToCart(${product.id})"
                                class="bg-blue-600
                                hover:bg-blue-700
                                text-white text-sm
                                font-semibold px-3 py-2
                                rounded-lg">

                                Add to Cart

                            </button>

                        </div>

                    </div>
                `;


                container.appendChild(productCard);

            });

        }


        // Add product to cart
        function addToCart(productId) {

            const product =
                products.find(p => p.id === productId);


            const existingItem =
                cart.find(item => item.id === productId);


            if (existingItem) {

                existingItem.quantity++;

            } else {

                cart.push({
                    ...product,
                    quantity: 1
                });

            }


            updateCart();

        }


        // Update cart
        function updateCart() {

            const container =
                document.getElementById("cartContainer");

            container.innerHTML = "";


            if (cart.length === 0) {

                container.innerHTML = `
                    <div class="text-center
                    py-8 text-gray-400">

                        <div class="text-4xl">🛒</div>

                        <p class="mt-2">
                            Your cart is empty.
                        </p>

                    </div>
                `;

            }


            let total = 0;
            let count = 0;


            cart.forEach(item => {

                const itemTotal =
                    item.price * item.quantity;

                total += itemTotal;
                count += item.quantity;


                const cartItem =
                    document.createElement("div");

                cartItem.className =
                    "border border-gray-200 rounded-lg p-3";


                cartItem.innerHTML = `

                    <div class="flex justify-between">

                        <div>

                            <h3 class="font-semibold text-sm">
                                ${item.name}
                            </h3>

                            <p class="text-blue-600
                            font-semibold">

                                ₹${item.price}

                            </p>

                        </div>

                        <button
                            onclick="removeFromCart(${item.id})"
                            class="text-red-500 text-xs">

                            Remove

                        </button>

                    </div>


                    <div class="flex justify-between
                    items-center mt-3">

                        <div class="flex items-center gap-2">

                            <button
                                onclick="changeQuantity(${item.id}, -1)"
                                class="bg-gray-100 px-2 py-1
                                rounded">

                                −

                            </button>

                            <span class="font-semibold">
                                ${item.quantity}
                            </span>

                            <button
                                onclick="changeQuantity(${item.id}, 1)"
                                class="bg-gray-100 px-2 py-1
                                rounded">

                                +

                            </button>

                        </div>

                        <span class="font-bold">
                            ₹${itemTotal}
                        </span>

                    </div>

                `;


                container.appendChild(cartItem);

            });


            document.getElementById("cartCount")
                .textContent = count;

            document.getElementById("cartTotal")
                .textContent = `₹${total}`;

        }


        // Change quantity
        function changeQuantity(productId, change) {

            const item =
                cart.find(item => item.id === productId);


            if (!item) return;


            item.quantity += change;


            if (item.quantity <= 0) {

                cart =
                    cart.filter(item => item.id !== productId);

            }


            updateCart();

        }


        // Remove product
        function removeFromCart(productId) {

            cart =
                cart.filter(item => item.id !== productId);

            updateCart();

        }


        // Clear cart
        function clearCart() {

            if (cart.length === 0) {

                alert("Your cart is already empty.");

                return;

            }


            cart = [];

            updateCart();

        }


        // Checkout
        function checkout() {

            if (cart.length === 0) {

                alert("Please add products to your cart first.");

                return;

            }


            let total = 0;

            cart.forEach(item => {

                total += item.price * item.quantity;

            });


            alert(
                "Order placed successfully! 🎉\n\n" +
                "Total Amount: ₹" + total +
                "\n\nThank you for shopping with us!"
            );


            cart = [];

            updateCart();

        }


        // Load products when page opens
        window.onload = () => {

            displayProducts();

            updateCart();

        };

    </script>

</body>
</html>
